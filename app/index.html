<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wordsmith Dictionary</title>
  <meta name="description" content="A simple English dictionary for learners. Works offline.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f9c94">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wordsmith">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- Top bar: app name -->
    <header class="topbar">
      <a class="title-tab" href="#/">
        <span id="logo-icon"></span>
        <span>Wordsmith</span>
      </a>
    </header>

    <!-- Tabs: Home, Favorites, Settings -->
    <nav class="tabs">
      <a class="tab" id="tab-home" href="#/">
        <span class="tab-icon" data-icon="home"></span>
        <span>Home</span>
      </a>
      <a class="tab" id="tab-favorites" href="#/favorites">
        <span class="tab-icon" data-icon="star"></span>
        <span>Favorites</span>
      </a>
      <a class="tab" id="tab-settings" href="#/settings">
        <span class="tab-icon" data-icon="gear"></span>
        <span>Settings</span>
      </a>
    </nav>

    <!-- The current screen is drawn here by js/screens.js -->
    <main id="screen" class="screen">
      <p class="loading">Loading dictionary...</p>
    </main>

  </div>

  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/wordforms.js"></script>
  <script src="js/search.js"></script>
  <script src="js/claude.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
